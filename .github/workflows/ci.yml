name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a build be run by hand from the Actions tab, which is also the
  # quickest way to confirm Actions is enabled at all.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds every target framework; runtimes 8 and 9 are needed
          # only so the tests actually execute on those frameworks.
          dotnet-version: |
            8.x
            9.x
            10.x

      - run: dotnet build -c Release

      - run: dotnet test -c Release --no-build

      # Packing on every change catches metadata and documentation problems at
      # the commit that caused them rather than at release.
      - run: dotnet pack src/WilliamBelle.Monitoring -c Release --no-build -o artifacts
