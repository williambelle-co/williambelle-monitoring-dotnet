name: Publish

# Releasing is deliberate: a published NuGet version can never be replaced or
# deleted, only unlisted. Tagging v0.2.0 publishes 0.2.0 — the tag carries the
# version, so there is no project file to forget to bump.
#
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']

  # A release path nobody has ever run is a release path nobody knows works.
  # Dispatching with a version already on nuget.org rehearses the whole chain
  # — test, pack, OIDC token exchange, push — and stops harmlessly at
  # --skip-duplicate instead of spending a version number. Run this after
  # anything that could disturb Trusted Publishing, a repository rename most
  # of all, since the policy is bound to the repository's name.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack and push. An already-published one rehearses without releasing.'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  # Required for Trusted Publishing: the workflow proves its identity to
  # nuget.org with a short-lived OIDC token instead of a long-lived API key,
  # so no publishing secret exists in this repository at all.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Source Link needs history to map commits

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds every target framework; runtimes 8 and 9 are needed
          # only so the tests actually execute on those frameworks.
          dotnet-version: |
            8.x
            9.x
            10.x

      # The signature scheme is this package's security boundary; a release
      # that changed it would break every installation at once.
      - name: Test
        run: dotnet test -c Release

      # The tag carries the version on a real release; a dispatch says it
      # outright. Read through an environment variable rather than interpolated
      # into the script, so the input cannot become shell.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Without this, a dispatch would pack version "main" and only fail
          # further down, somewhere less obvious.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a version number"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Packing $version"

      - name: Pack ${{ steps.version.outputs.value }}
        run: |
          dotnet pack src/WilliamBelle.Monitoring -c Release \
            -p:Version="${{ steps.version.outputs.value }}" -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          # The person who created the trust policy, not the account that owns
          # the package. Those differ here: the policy names WilliamBelle as
          # package owner, but a policy belongs to whoever added it. Getting
          # this wrong answers HTTP 401 with "no matching trust policy", which
          # reads like the policy is missing rather than misaddressed.
          # Deliberately not a secret — it is public on nuget.org, and hiding
          # it would hide the one value worth seeing when this fails.
          user: willpickeral

      - name: Push
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
